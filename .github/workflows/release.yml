name: Release

# Publishing a release (on GitHub: Releases › Draft a new release › new tag like 1.2.0 or v1.2.0 › Publish, or
# `git tag v1.2.0 && git push origin v1.2.0`) creates a version tag, which runs this workflow. The app gets its
# version from the tag, is tested and built for Apple Silicon and Intel, and the zip is attached to the release
# with its SHA-256. The Homebrew cask in flotttt/homebrew-tap is then pointed at it (needs the
# HOMEBREW_TAP_TOKEN secret, skipped without it).
#
# To build a release whose tag didn't run the workflow: Actions › Release › Run workflow, with that tag.
#
# The app is signed with the "SonyNotch Code Signing" certificate (SIGNING_CERT_P12 and SIGNING_CERT_PASSWORD
# secrets), the same for every release, so macOS keeps its Bluetooth and Spotify permissions across updates.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to build (e.g. 1.2.0 or v1.2.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set the app version from the tag
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag $TAG isn't a version like 1.2.0 or v1.2.0."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Client/macos/info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Client/macos/info.plist

      - name: Test
        run: make test

      - name: Import the signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12" ]; then
            echo "The SIGNING_CERT_P12 secret is missing: a release signed otherwise would lose users' permissions."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$SIGNING_CERT_P12" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm "$RUNNER_TEMP/signing.p12"
          # codesign only looks for identities in the keychain search list, whatever --keychain says.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KEYCHAIN"
          # The certificate's SHA-1 names it without a lookup by common name.
          HASH=$(security find-certificate -c "SonyNotch Code Signing" -Z "$KEYCHAIN" | awk '/SHA-1 hash:/ { print $NF }')
          if [ -z "$HASH" ]; then
            echo "The signing certificate isn't in the keychain."
            exit 1
          fi
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"

      - name: Build (release, universal)
        run: make release

      - name: Check the signature
        run: codesign -dr - build/SonyNotch.app 2>&1 | grep -q 'certificate root'

      - name: Checksum
        run: |
          cd build
          shasum -a 256 SonyNotch.zip | tee SonyNotch.zip.sha256

      # A release already made on GitHub for this tag (title and notes written there) only gets the files.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/SonyNotch.zip build/SonyNotch.zip.sha256 --clobber
          else
            gh release create "$TAG" build/SonyNotch.zip build/SonyNotch.zip.sha256 \
              --title "SonyNotch $VERSION" \
              --generate-notes
          fi

      # The download URL uses the exact tag, since tags may or may not start with "v".
      - name: Update the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN isn't set, the Homebrew cask isn't updated."
            exit 0
          fi
          FILE=Casks/sonynotch.rb
          SHA256=$(cut -d ' ' -f 1 build/SonyNotch.zip.sha256)
          URL="https://github.com/flotttt/SonyNotch/releases/download/$TAG/SonyNotch.zip"
          gh api "repos/flotttt/homebrew-tap/contents/$FILE" > current.json
          jq -r .content current.json | base64 -D > sonynotch.rb
          sed -i '' -E \
            -e "s|^  version \".*\"|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" \
            -e "s|^  url \".*\"|  url \"$URL\"|" \
            sonynotch.rb
          gh api -X PUT "repos/flotttt/homebrew-tap/contents/$FILE" \
            -f message="sonynotch $VERSION" \
            -f content="$(base64 -i sonynotch.rb)" \
            -f sha="$(jq -r .sha current.json)" > /dev/null
          echo "Homebrew cask updated to $VERSION"

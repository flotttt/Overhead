name: Release

# Push a version tag to publish a release:
#   git tag v1.0.0 && git push origin v1.0.0
# The app gets its version from the tag, is tested and built for Apple Silicon and Intel, and the zip is attached
# to a GitHub release with its SHA-256. The Homebrew cask in flotttt/homebrew-tap is then pointed at the new
# version (needs the HOMEBREW_TAP_TOKEN secret, skipped without it).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set the app version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Client/macos/info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Client/macos/info.plist

      - name: Test
        run: make test

      - name: Build (release, universal)
        run: make release

      - name: Checksum
        run: |
          cd build
          shasum -a 256 SonyNotch.zip | tee SonyNotch.zip.sha256

      # A release already made by hand for this tag (title and notes written on GitHub) only gets the files.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/SonyNotch.zip build/SonyNotch.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/SonyNotch.zip build/SonyNotch.zip.sha256 \
              --title "SonyNotch $VERSION" \
              --generate-notes
          fi

      - name: Update the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN isn't set, the Homebrew cask isn't updated."
            exit 0
          fi
          FILE=Casks/sonynotch.rb
          SHA256=$(cut -d ' ' -f 1 build/SonyNotch.zip.sha256)
          gh api "repos/flotttt/homebrew-tap/contents/$FILE" > current.json
          jq -r .content current.json | base64 -D > sonynotch.rb
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" sonynotch.rb
          gh api -X PUT "repos/flotttt/homebrew-tap/contents/$FILE" \
            -f message="sonynotch $VERSION" \
            -f content="$(base64 -i sonynotch.rb)" \
            -f sha="$(jq -r .sha current.json)" > /dev/null
          echo "Homebrew cask updated to $VERSION"
